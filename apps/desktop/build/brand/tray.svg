<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Tray state: the small master for the size, a transparent ring cut from its corner, and the state dot.
       Dot 32 / cut 44 at (224, 224): at 16 px a 4 px dot in the 4 x 4 corner, a clear pixel row under the right bar. -->
  <defs>
    <mask id="t-cut">
      <rect width="256" height="256" fill="#fff"/>
      <circle cx="224" cy="224" r="44" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#t-cut)"><!--MARK x=0 y=0 size=256--></g>
  <circle cx="224" cy="224" r="32" fill="{{COLOR}}"/>
</svg>
