<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Hand-fitted master, 16 px grid. Tray at 100 %. White 4 px + soft outer edge, 1 px gap, indigo 3 px + soft edge. The gap steps one pixel left at row 10 (the sway).
       Drawn pixel by pixel, not scaled from mark.svg. Map: W/I = white/indigo at 100 %, 1-9 / a-i = 10-90 %.
       ................
       .....5W3........
       ....2WW8........
       ....6WWW........
       ...1WWWW........
       ...2WWWW........
       ...3WWWW.cfa....
       ...4WWWW.IIIb...
       ...4WWWW.IIId...
       ...3WWWW.IIIc...
       ...2WWW5.IIIa...
       ....WWW.dIIc....
       ....7WW.IIf.....
       .....8W.Ia......
       ......5.d.......
       ................ -->
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22232a"/>
      <stop offset="1" stop-color="#0f1013"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#s-bg)"/>
  <g fill="#f7f8f8" shape-rendering="crispEdges"><rect x="5" y="1" width="1" height="1" fill-opacity="0.5"/><rect x="6" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1" fill-opacity="0.3"/><rect x="4" y="2" width="1" height="1" fill-opacity="0.2"/><rect x="5" y="2" width="2" height="1"/><rect x="7" y="2" width="1" height="1" fill-opacity="0.8"/><rect x="4" y="3" width="1" height="1" fill-opacity="0.6"/><rect x="5" y="3" width="3" height="1"/><rect x="3" y="4" width="1" height="1" fill-opacity="0.1"/><rect x="4" y="4" width="4" height="1"/><rect x="3" y="5" width="1" height="1" fill-opacity="0.2"/><rect x="4" y="5" width="4" height="1"/><rect x="3" y="6" width="1" height="1" fill-opacity="0.3"/><rect x="4" y="6" width="4" height="1"/><rect x="3" y="7" width="1" height="1" fill-opacity="0.4"/><rect x="4" y="7" width="4" height="1"/><rect x="3" y="8" width="1" height="1" fill-opacity="0.4"/><rect x="4" y="8" width="4" height="1"/><rect x="3" y="9" width="1" height="1" fill-opacity="0.3"/><rect x="4" y="9" width="4" height="1"/><rect x="3" y="10" width="1" height="1" fill-opacity="0.2"/><rect x="4" y="10" width="3" height="1"/><rect x="7" y="10" width="1" height="1" fill-opacity="0.5"/><rect x="4" y="11" width="3" height="1"/><rect x="4" y="12" width="1" height="1" fill-opacity="0.7"/><rect x="5" y="12" width="2" height="1"/><rect x="5" y="13" width="1" height="1" fill-opacity="0.8"/><rect x="6" y="13" width="1" height="1"/><rect x="6" y="14" width="1" height="1" fill-opacity="0.5"/></g>
  <g fill="#8b8ef7" shape-rendering="crispEdges"><rect x="9" y="6" width="1" height="1" fill-opacity="0.3"/><rect x="10" y="6" width="1" height="1" fill-opacity="0.6"/><rect x="11" y="6" width="1" height="1" fill-opacity="0.1"/><rect x="9" y="7" width="3" height="1"/><rect x="12" y="7" width="1" height="1" fill-opacity="0.2"/><rect x="9" y="8" width="3" height="1"/><rect x="12" y="8" width="1" height="1" fill-opacity="0.4"/><rect x="9" y="9" width="3" height="1"/><rect x="12" y="9" width="1" height="1" fill-opacity="0.3"/><rect x="9" y="10" width="3" height="1"/><rect x="12" y="10" width="1" height="1" fill-opacity="0.1"/><rect x="8" y="11" width="1" height="1" fill-opacity="0.4"/><rect x="9" y="11" width="2" height="1"/><rect x="11" y="11" width="1" height="1" fill-opacity="0.3"/><rect x="8" y="12" width="2" height="1"/><rect x="10" y="12" width="1" height="1" fill-opacity="0.6"/><rect x="8" y="13" width="1" height="1"/><rect x="9" y="13" width="1" height="1" fill-opacity="0.1"/><rect x="8" y="14" width="1" height="1" fill-opacity="0.4"/></g>
