<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Small master, 16 px grid (16, and 32 at 2x). Bars on whole pixels: 2 wide, 2 apart, 6/10/6 tall (3/5/3). -->
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22232a"/>
      <stop offset="1" stop-color="#0f1013"/>
    </linearGradient>
    <linearGradient id="s-bar" x1="8" y1="3" x2="8" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5a8fb"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#s-bg)"/>
  <g fill="url(#s-bar)">
    <rect x="3" y="5" width="2" height="6" rx="1"/>
    <rect x="7" y="3" width="2" height="10" rx="1"/>
    <rect x="11" y="5" width="2" height="6" rx="1"/>
  </g>
</svg>
