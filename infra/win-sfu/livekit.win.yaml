# Windows-native SFU (one node, no Docker, behind the home router). Template: sfu.mjs renders it into
# run/livekit.yaml on every start, replacing <DOMAIN>, <API_KEY>, <API_URL> and <LAN_IP>.
#
# Reachable from the internet (router mapping + Windows Firewall rule, both scoped to these ports):
#   7882/udp  WebRTC media, ALL participants on ONE port (UDP mux)
#   7881/tcp  ICE over TCP (networks that block UDP)
#   3478/udp  TURN/UDP
#   443/tcp   Caddy: wss://<DOMAIN> -> 127.0.0.1:7870 and TURN/TLS turn.<DOMAIN> -> 127.0.0.1:5349 (split by SNI)
# 7870 and 5349 have no firewall rule and no router mapping: only Caddy, on this same PC, reaches them.
#
# Keys are not in this file: the process gets LIVEKIT_KEYS="<key>: <secret>" from .env, the SAME pair as the Railway
# API's LIVEKIT_API_KEY / LIVEKIT_API_SECRET (tokens and webhooks are signed with it).
#
# Signaling is on 7870, not LiveKit's usual 7880: this PC is also the dev machine and `npm run dev` runs its own SFU
# on 127.0.0.1:7880 (infra/livekit/livekit.dev.yaml).
port: 7870
bind_addresses:
  - "127.0.0.1"
rtc:
  udp_port: 7882
  tcp_port: 7881
  # Learn the public IPv4 via STUN at startup. sfu.mjs restarts LiveKit when the public IP changes, because LiveKit
  # never looks again while running.
  use_external_ip: true
  # LiveKit would confirm the STUN answer by sending a packet to <public IP>:7882 from inside the LAN, which depends
  # on the router's NAT loopback; when that check fails it silently advertises the private IP (measured with the
  # Linux kit, infra/home-sfu). doctor.mjs checks the forwarding instead.
  skip_external_ip_validation: true
  enable_loopback_candidate: false
  # Only the interface that routes to the internet. A desktop has others (VPN adapters, IPv6 privacy addresses);
  # without this filter LiveKit would offer every one of them to every participant.
  ips:
    includes:
      - <LAN_IP>/32
turn:
  enabled: true
  domain: turn.<DOMAIN>              # DuckDNS answers every name under <DOMAIN> with the same IP: no extra record
  # Caddy terminates TLS on 443 and forwards plain TCP here, so LiveKit needs no certificate files.
  tls_port: 5349
  external_tls: true
  udp_port: 3478
webhook:
  # Key *name* (not the secret) that signs webhooks; must be the key in LIVEKIT_KEYS.
  api_key: <API_KEY>
  urls:
    - <API_URL>/api/v1/livekit/webhook
room:
  # Same as dev and the Linux kits: rooms close quickly after the last participant leaves.
  empty_timeout: 20
  departure_timeout: 10
logging:
  level: info
