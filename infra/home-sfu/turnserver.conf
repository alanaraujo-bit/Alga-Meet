# coturn for the Sala de Cinema (docker-compose.yaml, service coturn). No secret and no realm here: the entrypoint
# passes --static-auth-secret (CINEMA_TURN_SECRET) and --realm (<DUCKDNS_SUBDOMAIN>.duckdns.org) from .env.
# Credentials are TURN REST (apps/server/src/cinema.ts): username "<expiryUnix>:<userId>", password
# base64(HMAC-SHA1(secret, username)).
# 3478/udp already belongs to LiveKit's TURN
listening-port=3479
min-port=49160
max-port=49200
use-auth-secret
fingerprint
no-cli
no-tls
no-dtls
# peers are WebRTC UDP candidates only
no-tcp-relay
no-multicast-peers
no-software-attribute
pidfile=/tmp/turnserver.pid
userdb=/tmp/turndb
log-file=stdout
simple-log
# coturn counts BYTES per second. Total 3750000 B/s = 30 Mbps for every relay together (spec 6.4); each relayed
# session 1250000 B/s = 10 Mbps, so one viewer cannot reserve the whole capacity.
bps-capacity=3750000
max-bps=1250000
# user-quota: allocations per credential (one per peer connection); total-quota: allocations at once, all users.
user-quota=4
total-quota=12
# The relay must never become a door into the home LAN (or the host): refuse every non-public peer.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=198.18.0.0-198.19.255.255
# IPv4 only: every IPv6 peer is refused (this range is all of IPv6, which also covers ::1, fc00::/7, fe80::/10,
# ::ffff:0:0/96 and 64:ff9b::/96, listed anyway so the intent survives a future edit).
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
# The home's own public IP is denied too: the entrypoint adds it (--denied-peer-ip) from the DuckDNS name.
# coturn cannot mask client IPs in its log; logs rotate (10 MB x 3) and are shipped nowhere.
