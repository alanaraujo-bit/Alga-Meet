# coturn for the Sala de Cinema (docker-compose.yaml, service coturn). No secret and no realm here: the entrypoint
# passes --static-auth-secret (CINEMA_TURN_SECRET) and --realm (<DUCKDNS_SUBDOMAIN>.duckdns.org) from .env.
# Credentials are TURN REST (apps/server/src/cinema.ts): username "<expiryUnix>:<userId>", password
# base64(HMAC-SHA1(secret, username)).
# 3478/udp already belongs to LiveKit's TURN
listening-port=3479
min-port=49160
max-port=49200
use-auth-secret
fingerprint
no-cli
no-tls
no-dtls
# peers are WebRTC UDP candidates only
no-tcp-relay
no-multicast-peers
no-software-attribute
pidfile=/tmp/turnserver.pid
userdb=/tmp/turndb
log-file=stdout
simple-log
# Total 30 Mbps for every relay together (spec 6.4); one allocation may use all of it.
bps-capacity=30000000
max-bps=30000000
# The relay must never become a door into the home LAN (or the host): refuse every non-public peer.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# coturn cannot mask client IPs in its log; logs rotate (10 MB x 3) and are shipped nowhere.
