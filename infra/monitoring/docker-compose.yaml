# Monitoring on the SFU VM — NOT deployed (docs/infra/observability.md §5). In /opt/monitoring on the VM, next to
# prometheus.yml, alerts.yaml and metrics_token:
#   docker compose up -d
# Everything listens on 127.0.0.1 only; open Grafana through an SSH tunnel: ssh -L 3000:127.0.0.1:3000 <vm>.
# Budget on a 2-4 vCPU VM shared with LiveKit: ~0.1 vCPU and < 600 MB RAM together; the memory limits enforce it.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - ./metrics_token:/etc/prometheus/metrics_token:ro
      - ./prometheus_data:/prometheus
    mem_limit: 384m

  grafana:
    image: grafana/grafana-oss:12.1.0
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana_data:/var/lib/grafana
    mem_limit: 192m

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
